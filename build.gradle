plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group
def modVersion = project.version.toString()
def licenseArchiveName = project.name
def fabricKeyMappingApiVersion = project.fabric_key_mapping_api_version
def fabricLifecycleEventsVersion = project.fabric_lifecycle_events_version
def fabricRenderingVersion = project.fabric_rendering_version
def fabricResourceLoaderVersion = project.fabric_resource_loader_version
def fabricScreenApiVersion = project.fabric_screen_api_version
def fabricApiVersion = project.fabric_api_version
def localModMenu = file(project.modmenu_jar)
def localJade = file(project.jade_jar)
def fabricItemApiVersion = project.fabric_item_api_version
def fabricNetworkingApiVersion = project.fabric_networking_api_version
def fabricMessageApiVersion = project.fabric_message_api_version

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
}

sourceSets {
    printer {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

loom {
    mods {
        "litematicaplus" {
            sourceSet sourceSets.client
            sourceSet sourceSets.printer
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "litematicaplus_gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (providers.gradleProperty("withLitematica").isPresent()) {
        gametestRuntimeOnly("maven.modrinth:litematica:0.29.1") { transitive = false }
        gametestRuntimeOnly("maven.modrinth:malilib:0.30.2") { transitive = false }
    }
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${fabricKeyMappingApiVersion}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${fabricLifecycleEventsVersion}"
    implementation "net.fabricmc.fabric-api:fabric-rendering-v1:${fabricRenderingVersion}"
    implementation "net.fabricmc.fabric-api:fabric-resource-loader-v1:${fabricResourceLoaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-screen-api-v1:${fabricScreenApiVersion}"
    implementation "net.fabricmc.fabric-api:fabric-item-api-v1:${fabricItemApiVersion}"
    implementation "net.fabricmc.fabric-api:fabric-networking-api-v1:${fabricNetworkingApiVersion}"
    implementation "net.fabricmc.fabric-api:fabric-message-api-v1:${fabricMessageApiVersion}"
    if (localJade.isFile()) {
        compileOnly files(localJade)
    } else {
        compileOnly("maven.modrinth:jade:${project.jade_version}") { transitive = false }
    }

    if (localModMenu.isFile()) {
        compileOnly files(localModMenu)
    } else {
        compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
            transitive = false
        }
    }

    gametestImplementation sourceSets.client.output
    gametestImplementation sourceSets.printer.output
    gametestImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    testImplementation sourceSets.client.output
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.10.1"
}

if (providers.gradleProperty("withSyncmatica").isPresent()) {
    def syncmaticaServer = layout.projectDirectory.dir("run/syncmatica-server").asFile
    def purpurUrl = "https://api.purpurmc.org/v2/purpur/${project.minecraft_version}/${project.syncmatica_test_purpur_build}/download"
    def purpurMd5 = project.syncmatica_test_purpur_md5
    def pluginUrl = project.syncmatica_test_plugin_url
    def pluginSha512 = project.syncmatica_test_plugin_sha512
    def digestOf = { File file, String algorithm ->
        java.security.MessageDigest.getInstance(algorithm).digest(file.bytes).encodeHex().toString()
    }
    def download = { String url, File target, String algorithm, String expected ->
        def part = new File(target.parentFile, target.name + ".part")
        def connection = (HttpURLConnection) URI.create(url).toURL().openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 300000
        connection.instanceFollowRedirects = true
        connection.setRequestProperty("User-Agent", "litematica-plus-lts gametest")
        try {
            if (connection.responseCode != 200) {
                throw new GradleException("GET ${url} returned HTTP ${connection.responseCode}")
            }
            part.bytes = connection.inputStream.bytes
        } finally {
            connection.disconnect()
        }
        def actual = digestOf(part, algorithm)
        if (actual != expected) {
            part.delete()
            throw new GradleException("${url}: ${algorithm} mismatch, got ${actual}")
        }
        target.delete()
        part.renameTo(target)
    }
    def prepareSyncmaticaServer = tasks.register("prepareSyncmaticaServer") {
        outputs.upToDateWhen { false }
        doLast {
            syncmaticaServer.mkdirs()
            def purpur = new File(syncmaticaServer, "purpur.jar")
            if (!purpur.isFile() || digestOf(purpur, "MD5") != purpurMd5) {
                download(purpurUrl, purpur, "MD5", purpurMd5)
            }
            def plugins = new File(syncmaticaServer, "plugins")
            plugins.mkdirs()
            def plugin = new File(plugins, "SyncmaticaPaper.jar")
            if (!plugin.isFile() || digestOf(plugin, "SHA-512") != pluginSha512) {
                download(pluginUrl, plugin, "SHA-512", pluginSha512)
            }
            def stats = new File(plugins, "bStats")
            stats.mkdirs()
            new File(stats, "config.yml").text = [
                    "enabled: false",
                    "serverUuid: 00000000-0000-0000-0000-000000000000",
                    "logFailedRequests: false"
            ].join(System.lineSeparator()) + System.lineSeparator()
            new File(syncmaticaServer, "eula.txt").text = "eula=true" + System.lineSeparator()
            new File(syncmaticaServer, "server.properties").text = [
                    "server-ip=127.0.0.1",
                    "online-mode=false",
                    "white-list=false",
                    "level-seed=syncmatica",
                    "gamemode=creative",
                    "difficulty=peaceful",
                    "generate-structures=false",
                    "spawn-protection=0",
                    "view-distance=4",
                    "simulation-distance=4",
                    "motd=litematica plus syncmatica test"
            ].join(System.lineSeparator()) + System.lineSeparator()
        }
    }
    tasks.named("runClientGameTest") {
        dependsOn prepareSyncmaticaServer
        systemProperty "litematicaplus.syncmaticaServer", syncmaticaServer.absolutePath
        systemProperty "fabric.client.gametest.disableNetworkSynchronizer", "true"
    }
}

tasks.withType(ProcessResources).configureEach {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xlint:deprecation"]
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    systemProperty "litematicaplus.sampleDir", providers.gradleProperty("sampleDir").getOrElse("")
    testLogging {
        showStandardStreams = providers.gradleProperty("sampleDir").isPresent()
    }
}

def printerClasses = "org/lts/litematicaplus/printer/**"
def printerAssets = "assets/litematicaplus_printer/**"

jar {
    from("LICENSE") {
        rename { "${it}_${licenseArchiveName}" }
    }
    doLast {
        def leaked = zipTree(archiveFile.get().asFile).matching {
            include printerClasses
            include printerAssets
        }.files
        if (!leaked.isEmpty()) {
            throw new GradleException("Printer files leaked into the standard jar: ${leaked*.name}")
        }
    }
}

def printerModJson = tasks.register("printerModJson") {
    def source = file("src/client/resources/fabric.mod.json")
    def target = layout.buildDirectory.file("generated/printer/fabric.mod.json")
    inputs.file source
    inputs.property "version", modVersion
    outputs.file target
    doLast {
        def json = new groovy.json.JsonSlurper().parse(source)
        json.version = modVersion
        json.name = json.name + " (printer)"
        json.description = json.description + " Printer edition: places the schematic around you by itself."
        json.entrypoints.client = json.entrypoints.client + ["org.lts.litematicaplus.printer.PrinterClient"]
        def out = target.get().asFile
        out.parentFile.mkdirs()
        out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), "UTF-8")
    }
}

def printerJar = tasks.register("printerJar", Zip) {
    group = "build"
    description = "Builds the printer edition that places the schematic around the player by itself."
    dependsOn tasks.named("jar"), tasks.named("printerClasses"), printerModJson
    archiveBaseName = project.archives_base_name
    archiveVersion = modVersion
    archiveClassifier = "printer"
    archiveExtension = "jar"
    destinationDirectory = tasks.named("jar", Jar).flatMap { it.destinationDirectory }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(zipTree(tasks.named("jar", Jar).flatMap { it.archiveFile })) {
        exclude "fabric.mod.json"
    }
    from(sourceSets.printer.output)
    from(printerModJson)
    doLast {
        def included = zipTree(archiveFile.get().asFile).matching { include printerClasses }.files
        if (included.isEmpty()) {
            throw new GradleException("Printer classes are missing from the printer jar")
        }
    }
}

tasks.named("assemble") {
    dependsOn printerJar
}

if (providers.gradleProperty("withAxiom").isPresent()) {
    def axiomTest = configurations.detachedConfiguration(dependencies.create("maven.modrinth:axiom:${project.axiom_test_version}"))
    axiomTest.transitive = false
    tasks.named("runClientGameTest") {
        systemProperty "litematicaplus.axiomOnly", "true"
        doFirst {
            systemProperty "fabric.addMods", axiomTest.singleFile.absolutePath
        }
    }
}

if (providers.gradleProperty("uiOnly").isPresent()) {
    tasks.named("runClientGameTest") {
        systemProperty "litematicaplus.uiOnly", "true"
    }
}

if (providers.gradleProperty("printerOnly").isPresent()) {
    tasks.named("runClientGameTest") {
        systemProperty "litematicaplus.printerOnly", "true"
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
